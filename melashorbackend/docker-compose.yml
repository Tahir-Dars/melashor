services:
  db:
    image: postgres:latest
    ports:
      - "5342:5432"
    restart: always
    environment:
      POSTGRES_PASSWORD: newpassword

  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "8888:8080"
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

